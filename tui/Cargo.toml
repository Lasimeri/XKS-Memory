[package]
name = "xksm-tui"
version = "0.2.0"
edition = "2021"
description = "Terminal interface for XKS-Memory: sessions, recall and search, memories, embedding state (std only, no terminal crates)"
license = "MIT"
publish = false

[[bin]]
name = "xksm-tui"
path = "src/main.rs"

# No dependencies: the terminal layer (raw mode, input decoding, diff rendering) is src/term.rs.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
