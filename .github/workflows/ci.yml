name: ci
# Builds and tests every push and every tag from source on a clean Arch Linux (the platform it
# is developed on: CachyOS, an Arch derivative), then installs it with tools/install.sh into a
# temporary prefix. Nothing is uploaded: there are no binary release artifacts, a release is
# its source (the tag).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-24.04 # the host only; every step runs in the Arch container
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        flavor: [release, asan]
    steps:
      - name: packages (pacman)
        run: pacman -Syu --noconfirm --needed git cmake ninja sqlite rust
      - uses: actions/checkout@v5
      - name: toolchain
        run: |
          cc --version | head -n 1
          cmake --version | head -n 1
          sqlite3 --version
          cargo --version
      - name: requirements check of the installer
        run: sh tools/install.sh --check
      - name: configure
        run: |
          if [ "${{ matrix.flavor }}" = asan ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DXKSM_OPENCL=OFF \
              -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXKSM_OPENCL=OFF
          fi
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: ctest --test-dir build --output-on-failure
      - name: install from source (release flavor)
        if: matrix.flavor == 'release'
        run: |
          export XKSM_HOME="$RUNNER_TEMP/home"
          sh tools/install.sh --prefix "$RUNNER_TEMP/prefix" --no-claude
          printf 'placeholder ci turn' | "$RUNNER_TEMP/prefix/bin/xksm" turn --harness ci --session s1 --role user
          "$RUNNER_TEMP/prefix/bin/xksm" sessions
          "$RUNNER_TEMP/prefix/bin/xksm" verify
          test -x "$RUNNER_TEMP/prefix/bin/xksm-tui"
